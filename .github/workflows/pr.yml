name: Pull Request

on:
  push:
    branches:
      - "pull-request/[0-9]+"

env:
  PYTHONFAULTHANDLER: "1" # Dump tracebacks on fatal signals (SIGSEGV, SIGABRT, etc.)

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Run only the temporary Windows USD diagnostic workflow on this PR.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/usd-windows-tls-diagnostic.yml
