name: Build Warp Builder Images

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.12.13@sha256:b485bd65cc2cf1c9a93b3554012c9c3778cf7b1b5fd3d3096ce9e1226c97e1e6
  UV_VERSION: "0.12.13"

jobs:
  build-and-test:
    name: Build ${{ matrix.policy }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            policy: manylinux_2_28
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:53390351aeb4688114b02c36a23b3e6ce1166ee9b7afc5df1a4f776354fc764c
            cuda12_platform: linux-x86_64
            cuda13_platform: linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            policy: manylinux_2_34
            manylinux_image: quay.io/pypa/manylinux_2_34_aarch64@sha256:effc0e17319a56b2c7eaff0cb5dd81a2d2c2850410841d3f017378f52ead6442
            cuda12_platform: linux-aarch64
            cuda13_platform: linux-sbsa

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv for host-side setup
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up host Python
        run: uv python install

      - name: Set up CUDA Toolkit 12.9.2
        id: cuda12
        uses: ./.github/actions/setup-warp-cuda
        with:
          version: "12.9.2"
          platform: ${{ matrix.cuda12_platform }}
          cache-read: "true"
          cache-write: "true"

      - name: Set up CUDA Toolkit 13.4.1
        id: cuda13
        uses: ./.github/actions/setup-warp-cuda
        with:
          version: "13.4.1"
          platform: ${{ matrix.cuda13_platform }}
          cache-read: "true"
          cache-write: "true"

      - name: Generate image metadata
        id: meta
        env:
          MANYLINUX_POLICY: ${{ matrix.policy }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_BASE="ghcr.io/${OWNER_LOWER}/warp-builder"

          {
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image_cuda12=${IMAGE_BASE}:${MANYLINUX_POLICY}-cuda12.9.2-uv${UV_VERSION}-${TARGET_ARCH}"
            echo "image_cuda13=${IMAGE_BASE}:${MANYLINUX_POLICY}-cuda13.4.1-uv${UV_VERSION}-${TARGET_ARCH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build CUDA Toolkit 12.9.2 image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: docker/warp-builder
          file: docker/warp-builder/Dockerfile
          platforms: ${{ matrix.platform }}
          build-contexts: |
            cuda_toolkit=${{ steps.cuda12.outputs.cuda-path }}
          build-args: |
            CUDA_VERSION=12.9.2
            MANYLINUX_IMAGE=${{ matrix.manylinux_image }}
            MANYLINUX_POLICY=${{ matrix.policy }}
            TARGETARCH=${{ matrix.arch }}
            UV_IMAGE=${{ env.UV_IMAGE }}
            UV_VERSION=${{ env.UV_VERSION }}
          load: true
          tags: ${{ steps.meta.outputs.image_cuda12 }}
          cache-from: type=gha,scope=warp-builder-${{ matrix.policy }}-cuda12-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=warp-builder-${{ matrix.policy }}-cuda12-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build CUDA Toolkit 13.4.1 image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: docker/warp-builder
          file: docker/warp-builder/Dockerfile
          platforms: ${{ matrix.platform }}
          build-contexts: |
            cuda_toolkit=${{ steps.cuda13.outputs.cuda-path }}
          build-args: |
            CUDA_VERSION=13.4.1
            MANYLINUX_IMAGE=${{ matrix.manylinux_image }}
            MANYLINUX_POLICY=${{ matrix.policy }}
            TARGETARCH=${{ matrix.arch }}
            UV_IMAGE=${{ env.UV_IMAGE }}
            UV_VERSION=${{ env.UV_VERSION }}
          load: true
          tags: ${{ steps.meta.outputs.image_cuda13 }}
          cache-from: type=gha,scope=warp-builder-${{ matrix.policy }}-cuda13-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=warp-builder-${{ matrix.policy }}-cuda13-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Verify CUDA Toolkit 12.9.2 image offline
        env:
          EXPECTED_CUDA_PLATFORM: ${{ matrix.cuda12_platform }}
          EXPECTED_CUDA_VERSION: "12.9.2"
          IMAGE: ${{ steps.meta.outputs.image_cuda12 }}
        run: |
          docker run --rm --network=none \
            --env EXPECTED_CUDA_PLATFORM \
            --env EXPECTED_CUDA_VERSION \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            "${IMAGE}" \
            bash /workspace/docker/warp-builder/verify-image.sh

      - name: Verify CUDA Toolkit 13.4.1 image offline
        env:
          EXPECTED_CUDA_PLATFORM: ${{ matrix.cuda13_platform }}
          EXPECTED_CUDA_VERSION: "13.4.1"
          IMAGE: ${{ steps.meta.outputs.image_cuda13 }}
        run: |
          docker run --rm --network=none \
            --env EXPECTED_CUDA_PLATFORM \
            --env EXPECTED_CUDA_VERSION \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            "${IMAGE}" \
            bash /workspace/docker/warp-builder/verify-image.sh

      - name: Build Warp with embedded CUDA Toolkit 12.9.2
        env:
          IMAGE: ${{ steps.meta.outputs.image_cuda12 }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --env WARP_CACHE_PATH=/tmp/warp-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-cuda12 \
            "${IMAGE}" \
            uv run --no-python-downloads --python 3.12 build_lib.py --cuda-path=/opt/cuda

      - name: Build Warp with embedded CUDA Toolkit 13.4.1
        env:
          IMAGE: ${{ steps.meta.outputs.image_cuda13 }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --env WARP_CACHE_PATH=/tmp/warp-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-cuda13 \
            "${IMAGE}" \
            uv run --no-python-downloads --python 3.12 build_lib.py --cuda-path=/opt/cuda

      - name: Publish images
        env:
          IMAGE_CUDA12: ${{ steps.meta.outputs.image_cuda12 }}
          IMAGE_CUDA13: ${{ steps.meta.outputs.image_cuda13 }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo "## Published Warp builder images"
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"

          for IMAGE in "${IMAGE_CUDA12}" "${IMAGE_CUDA13}"; do
            SIZE_BYTES=$(docker image inspect "${IMAGE}" --format='{{.Size}}')
            SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "${SIZE_BYTES}")
            docker push "${IMAGE}"
            IMAGE_DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format '{{.Manifest.Digest}}')

            if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
              echo "Invalid published digest: ${IMAGE_DIGEST}" >&2
              exit 1
            fi

            {
              echo "- Tag: \`${IMAGE}\`"
              echo "  - Digest: \`${IMAGE_DIGEST}\`"
              echo "  - Platform: \`${IMAGE_PLATFORM}\`"
              echo "  - Size: ${SIZE_HUMAN}"
            } >> "${GITHUB_STEP_SUMMARY}"
          done
