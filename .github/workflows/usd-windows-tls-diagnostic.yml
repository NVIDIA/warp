# Temporary workflow for diagnosing usd-core native-library loading on the
# Windows RTX Pro 6000 runner. This workflow is not intended to be merged.
name: Windows USD TLS Diagnostic

on:
  workflow_call:

env:
  PYTHONFAULTHANDLER: "1"

jobs:
  probe-msvc-resolution-windows:
    name: Probe USD MSVC runtime resolution
    runs-on: windows-amd64-gpu-rtxpro6000-latest-1
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Configure artifact path
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'usd-msvc-resolution-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          "USD_TLS_ARTIFACT_DIR=$artifactDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Display runner information
        shell: pwsh
        run: |
          hostname
          Write-Output "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "ImageOS=$env:ImageOS"
          Write-Output "ImageVersion=$env:ImageVersion"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          nvidia-smi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install

      - name: Prepare minimal probe environment
        shell: pwsh
        run: |
          $probePrefix = uv run --extra dev `
            --with 'usd-core==26.8' --with 'blosc==1.11.4' `
            python -c "import sys; print(sys.prefix)"
          $probePrefix = ($probePrefix | Select-Object -Last 1).Trim()
          Write-Output "USD_PROBE_PREFIX=$probePrefix"
          "USD_PROBE_PREFIX=$probePrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Report MSVC runtime candidates
        shell: pwsh
        run: |
          $runtimeNames = @(
            'msvcp140.dll',
            'msvcp140_atomic_wait.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll'
          )
          $candidates = foreach ($name in $runtimeNames) {
            Join-Path "$env:WINDIR\System32" $name
            Join-Path "$env:USD_PROBE_PREFIX\bin" $name
          }
          Get-Item -LiteralPath $candidates -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, @{
              Name = 'FileVersion'
              Expression = { $_.VersionInfo.FileVersion }
            }, @{
              Name = 'ProductVersion'
              Expression = { $_.VersionInfo.ProductVersion }
            } |
            Format-List
          Get-Item -LiteralPath $candidates -ErrorAction SilentlyContinue |
            Get-FileHash -Algorithm SHA256 |
            Format-List Path, Hash

      - name: Run MSVC resolution probes
        shell: pwsh
        run: |
          $failed = $false
          $cases = @(
            'early-tf',
            'after-msvcp140-tf',
            'after-atomic-wait-tf',
            'after-msvc-directory-tf',
            'after-pxr-dll-path-tf',
            'after-msvc-tf'
          )
          foreach ($case in $cases) {
            uv run --extra dev `
              --with 'usd-core==26.8' --with 'blosc==1.11.4' `
              python tools/ci/usd_windows_tls_probe.py `
              --case $case --repeat 2 --workers 1 `
              --output-dir "$env:USD_TLS_ARTIFACT_DIR\$case"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          if ($failed) { exit 1 }

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: usd-msvc-resolution-${{ github.run_id }}
          path: ${{ runner.temp }}/usd-msvc-resolution-artifacts
          if-no-files-found: warn
          retention-days: 7
