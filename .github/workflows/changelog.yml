name: Changelog

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - CHANGELOG.md
      - "changelog/**"
      - pyproject.toml

concurrency:
  group: ${{ github.workflow }}-on-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-fragments:
    name: Validate fragments
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.16"

      - name: Set up Python
        run: uv python install

      - name: Render changelog draft
        run: >-
          uvx --from towncrier==25.8.0 towncrier build --draft
          --version Unreleased
