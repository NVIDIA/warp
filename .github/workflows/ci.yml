name: CI

on:
  workflow_dispatch:
    inputs:
      retain-wheel-artifacts:
        description: Retain NVIDIA/warp wheel artifacts for seven days instead of one; release branches and v* tags always keep them for 30 days
        required: false
        type: boolean
        default: false
      wheel-version-mode:
        description: Use the source or daily snapshot version for wheel artifacts
        required: false
        type: choice
        options:
          - source
          - snapshot
        default: source
      use-nvidia-runner:
        description: Use the 16-vCPU NVIDIA Windows runner
        type: boolean
        default: false
      bypass-build-cache:
        description: Force a native build
        type: boolean
        default: true
      probe-only:
        description: Check host MSVC and the CUDA CDN TLS connection
        type: boolean
        default: false

env:
  PYTHONFAULTHANDLER: "1" # Dump tracebacks on fatal signals (SIGSEGV, SIGABRT, etc.)

jobs:
  prepare-build-metadata:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      cache-suffix: ${{ steps.metadata.outputs.cache-suffix }}
      snapshot-date: ${{ steps.metadata.outputs.snapshot-date }}
      version-mode: ${{ steps.metadata.outputs.version-mode }}
    steps:
      - name: Resolve build metadata
        id: metadata
        env:
          REQUESTED_VERSION_MODE: ${{ inputs.wheel-version-mode || 'source' }}
        run: |
          version_mode="$REQUESTED_VERSION_MODE"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            version_mode="snapshot"
          fi
          if [[ "$version_mode" != "source" && "$version_mode" != "snapshot" ]]; then
            echo "Unsupported wheel version mode: $version_mode" >&2
            exit 1
          fi

          snapshot_date=$(TZ=America/Los_Angeles date +%Y%m%d)
          cache_suffix="$version_mode"
          if [[ "$version_mode" == "snapshot" ]]; then
            cache_suffix="snapshot-$snapshot_date"
          fi

          echo "cache-suffix=$cache_suffix" >> "$GITHUB_OUTPUT"
          echo "snapshot-date=$snapshot_date" >> "$GITHUB_OUTPUT"
          echo "version-mode=$version_mode" >> "$GITHUB_OUTPUT"

  build-warp:
    if: github.event_name != 'schedule' || github.repository == 'NVIDIA/warp'
    needs: prepare-build-metadata
    runs-on: ${{ inputs.use-nvidia-runner && 'windows-amd64-cpu16' || matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            cuda-version: 12.9.2
            cuda-platform: windows-x86_64
            build-args: ""
            artifact-name: build-artifact-windows-cuda12
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install
      - name: Probe host MSVC and CUDA CDN
        if: inputs.probe-only
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output ("Windows edition: " + $os.Caption)
          Write-Output ("Logical processors: " + [Environment]::ProcessorCount)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vsPath) {
              Write-Output "MSVC x64 install: $vsPath"
              Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Name
            } else {
              Write-Output "MSVC x64 install: missing"
            }
          } else {
            Write-Output "vswhere: missing"
          }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          Write-Output ("MSVC in PATH: " + [bool]$cl)
          $archive = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-12.9.27-archive.zip"
          & curl.exe --silent --show-error --fail --head --max-time 25 --output NUL $archive
          $curlExitCode = $LASTEXITCODE
          Write-Output "Windows curl TLS probe exit code: $curlExitCode"
          & uv run --no-project python -c 'import sys, urllib.request; print(urllib.request.urlopen(urllib.request.Request(sys.argv[1], method="HEAD"), timeout=25).status)' $archive
          $pythonExitCode = $LASTEXITCODE
          Write-Output "Python urllib TLS probe exit code: $pythonExitCode"
          exit 0

      - name: Set snapshot version
        if: "!inputs.probe-only && (needs.prepare-build-metadata.outputs.version-mode == 'snapshot')"
        run: uv run --no-project tools/ci/publishing/set_nightly_version.py --date ${{ needs.prepare-build-metadata.outputs.snapshot-date }}

      - name: Record Git commit
        run: uv run --no-project tools/ci/publishing/update_git_hash.py
        if: "!inputs.probe-only"

      - name: Synchronize version files
        run: uv run --no-project tools/pre-commit-hooks/check_version_consistency.py
        if: "!inputs.probe-only"

      - name: Cache build artifacts
        if: "!inputs.probe-only && (!inputs.bypass-build-cache && github.repository == 'NVIDIA/warp')"
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache-build
        with:
          path: warp/bin/
          # Hash only native-binary inputs. The metadata suffix prevents a
          # source-version binary from being restored into a snapshot build.
          key: build-${{ matrix.artifact-name }}-${{ matrix.cuda-version }}-${{ needs.prepare-build-metadata.outputs.cache-suffix }}-${{ hashFiles('build_lib.py', 'build_llvm.py', 'warp/_src/build_architecture.py', 'warp/_src/build_dll.py', 'warp/native/clang/clang.cpp', 'warp/native/**/*.cpp', 'warp/native/**/*.cu', 'warp/native/**/*.cuh', 'warp/native/**/*.h', 'warp/native/libdevice/*.bc', 'warp/native/warp.map', 'deps/llvm-deps.packman.xml', 'deps/libmathdx-deps.packman.xml', '.github/actions/setup-warp-cuda/action.yml', 'tools/ci/cuda_toolkit.py', 'tools/ci/cuda_toolkit_requirements.json', 'tools/ci/cuda_toolkit_lock.json') }}

      - name: Set up CUDA Toolkit for Warp
        if: "!inputs.probe-only && (steps.cache-build.outputs.cache-hit != 'true' && matrix.cuda-version != '')"
        uses: ./.github/actions/setup-warp-cuda
        with:
          version: ${{ matrix.cuda-version }}
          platform: ${{ matrix.cuda-platform }}
          cache-read: ${{ github.repository == 'NVIDIA/warp' }}
          cache-write: false

      - name: Build Warp
        if: "!inputs.probe-only && (steps.cache-build.outputs.cache-hit != 'true')"
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-cache-${{ matrix.artifact-name }}
        run: uv run build_lib.py ${{ matrix.build-args }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            VERSION.md
            warp/config.py
            warp/bin/
            warp/native/version.h
          retention-days: ${{ github.repository == 'NVIDIA/warp' && 7 || 1 }}
        if: "!inputs.probe-only"
    timeout-minutes: 60

  test-warp-cpu:
    if: ${{ inputs.bypass-build-cache && !inputs.probe-only }}
    runs-on: ${{ matrix.os }}
    needs: build-warp
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            artifact-name: build-artifact-windows-cuda12
            jax-extra: jax>=0.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.6"

      - name: Set up Python
        run: uv python install

      - name: Download Warp build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: .

      - name: Run Tests
        if: matrix.jax-extra != ''
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-cache-${{ matrix.artifact-name }}-tests
        run: uv run --extra dev --with "${{ matrix.jax-extra }}" -m warp.tests --junit-report-xml rspec.xml -s autodetect

      - name: Run Tests
        if: matrix.jax-extra == ''
        env:
          WARP_CACHE_PATH: ${{ runner.temp }}/warp-cache-${{ matrix.artifact-name }}-tests
        run: uv run --extra dev -m warp.tests --junit-report-xml rspec.xml -s autodetect

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: "rspec.xml"
          show: "fail"
        if: always()
    timeout-minutes: 60
run-name: Windows CUDA 12 benchmark (NVIDIA=${{ inputs.use-nvidia-runner }}, cold=${{ inputs.bypass-build-cache }}, probe=${{ inputs.probe-only }})
